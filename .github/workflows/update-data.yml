name: Update contest data

on:
  schedule:
    - cron: '17 22 * * 0' # Monday 06:17 Asia/Shanghai; execution may be delayed.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-contest-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run sync
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Open or update data pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: data/weekly-update
          delete-branch: true
          add-paths: data/
          commit-message: 'chore(data): update XCPCIO snapshots and discovery index'
          title: '更新 XCPCIO 榜单与待整理比赛'
          body: |
            同步已收录比赛的最终榜数据，并更新 data/discovered.json 中的待整理比赛。

            新比赛仍需核对 QOJ 映射、最终榜和奖牌分组。此次更新不会推测映射或自动发布译文。
            本次工作流已执行统计测试、类型检查和完整静态构建；请检查分级变化与上游来源后合并。

            GITHUB_TOKEN 创建的 PR 不会自动触发另一个 PR 工作流。可查看本次 Update contest data 的验证记录；合并后 Pages 工作流会重新检查并部署。
